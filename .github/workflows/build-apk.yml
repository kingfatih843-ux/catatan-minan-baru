
name: Build Catatan Minan APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o Catatan_Minan_Aplikasi_Baru.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix Java and Kotlin targets
        working-directory: CatatanMinanBaru
        run: |
          python3 - <<'PY'
          p = "app/build.gradle"
          s = open(p).read()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          )
          open(p, "w").write(s)
          PY

      - name: Build APK
        run: gradle :app:assembleDebug
        working-directory: CatatanMinanBaru

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Minan-APK
          path: CatatanMinanBaru/app/build/outputs/apk/debug/app-debug.apk
