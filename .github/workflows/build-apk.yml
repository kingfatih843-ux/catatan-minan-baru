
name: Build Catatan Minan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o Catatan_Minan_Aplikasi_Baru.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix Java and Kotlin targets
        working-directory: CatatanMinanBaru
        run: |
          python3 - <<'PY'
          import re

          p = "app/build.gradle"
          with open(p) as f:
              s = f.read()

          if "compileOptions {" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """, 1)

          if "kotlinOptions {" not in s:
              s = s.replace("android {", """android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          """, 1)

          s = re.sub(
              r"jvmTarget\s*=\s*['\"](?:1\.8|11|17)['\"]",
              "jvmTarget = '17'",
              s
          )

          with open(p, "w") as f:
              f.write(s)
          PY

      
      - name: Inspect and fix hintTextColor
        working-directory: CatatanMinanBaru
        run: |
          python3 - <<'PY'
          import re

          p = "app/src/main/java/com/minan/catatan/MainActivity.kt"

          with open(p) as f:
              s = f.read()

          print("=== KODE SEBELUM PERBAIKAN ===")
          for i, line in enumerate(s.splitlines(), 1):
              if i in (83, 85):
                  print(f"{i}: {line}")

          # Perbaiki pola assignment yang salah
          s = re.sub(
              r'\.setHintTextColor\s*=\s*([^,\n)]+)',
              r'.setHintTextColor(\1)',
              s
          )

          s = re.sub(
              r'\.hintTextColor\s*=\s*([^,\n)]+)',
              r'.setHintTextColor(\1)',
              s
          )

          with open(p, "w") as f:
              f.write(s)

          print("=== PERBAIKAN SELESAI ===")
          PY

        working-directory: CatatanMinanBaru
        run: |
          python3 - <<'PY'
          p = "app/src/main/java/com/minan/catatan/MainActivity.kt"

          with open(p) as f:
              s = f.read()

          s = s.replace(
              "hintTextColor",
              "setHintTextColor"
          )

          with open(p, "w") as f:
              f.write(s)

          print("Pemeriksaan hintTextColor selesai")
          PY

      - name: Show Kotlin error source
        working-directory: CatatanMinanBaru
        run: |
          echo "===== BARIS 80-87 ====="
          sed -n '80,87p' app/src/main/java/com/minan/catatan/MainActivity.kt
          echo "===== KONTEKS HINT COLOR ====="
          grep -n -C 2 "HintTextColor\|hintTextColor" app/src/main/java/com/minan/catatan/MainActivity.kt

      - name: Build APK
        working-directory: CatatanMinanBaru
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Minan-APK
          path: CatatanMinanBaru/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Debug MainActivity Kotlin
        working-directory: CatatanMinanBaru
        run: |
          echo "=== MainActivity.kt baris 78-90 ==="
          nl -ba app/src/main/java/com/minan/catatan/MainActivity.kt | sed -n '78,90p'

